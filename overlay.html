<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; display: flex; justify-content: center; align-items: flex-start; height: 100vh; background: transparent; }
        #scoreboard { padding: 20px 40px; color: white; font-size: 40px; font-weight: bold; border-radius: 10px; transition: 0.5s; }
    </style>
</head>
<body>
    <div id="scoreboard">
        <span id="nameA">Team A</span> - <span id="nameB">Team B</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA2tP0hFu0r9mDNT8uBX-ajXAg5Sv4UcxY",
            authDomain: "svlive-a3c16.firebaseapp.com",
            databaseURL: "https://svlive-a3c16-default-rtdb.firebaseio.com",
            projectId: "svlive-a3c16",
            storageBucket: "svlive-a3c16.firebasestorage.app",
            messagingSenderId: "392364721886",
            appId: "1:392364721886:web:e374d5a5f185d6b56a644f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        onValue(ref(db, 'liveData'), (snapshot) => {
            const data = snapshot.val();
            if(data) {
                document.getElementById('nameA').innerText = data.teamAName;
                document.getElementById('nameB').innerText = data.teamBName;
                document.getElementById('scoreboard').style.backgroundColor = data.color;
            }
        });
    </script>
</body>
</html>
