<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: #fff; padding: 15px; }
        .card { background: #333; padding: 15px; margin-bottom: 15px; border-radius: 8px; }
        input, select, button { width: 100%; padding: 10px; margin: 5px 0; border-radius: 5px; border: none; }
        button { background: #007bff; color: #fff; font-weight: bold; }
    </style>
</head>
<body>
    <h2>Overlay Control Panel</h2>
    <div class="card">
        <input type="text" id="teamA" placeholder="Team A Name">
        <input type="text" id="teamB" placeholder="Team B Name">
        <input type="color" id="themeColor">
        <button onclick="updateData()">Update Scores & Theme</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA2tP0hFu0r9mDNT8uBX-ajXAg5Sv4UcxY",
            authDomain: "svlive-a3c16.firebaseapp.com",
            databaseURL: "https://svlive-a3c16-default-rtdb.firebaseio.com",
            projectId: "svlive-a3c16",
            storageBucket: "svlive-a3c16.firebasestorage.app",
            messagingSenderId: "392364721886",
            appId: "1:392364721886:web:e374d5a5f185d6b56a644f"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.updateData = () => {
            set(ref(db, 'liveData'), {
                teamAName: document.getElementById('teamA').value,
                teamBName: document.getElementById('teamB').value,
                color: document.getElementById('themeColor').value
            });
            alert("Data Updated!");
        };
    </script>
</body>
</html>
